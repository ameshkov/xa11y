name: strands-xa11y SDK canary

# strands-xa11y declares `strands-agents>=1.0.0` with no ceiling, so every new
# install resolves the newest SDK. This job resolves it the same way, once a
# week, so SDK drift breaks here before it breaks someone's `pip install`.
#
# It is separate from ci.yml rather than a scheduled job inside it: ci.yml has
# no schedule trigger, and adding one would fire all sixteen of its jobs.

on:
  schedule:
    # Monday 06:00 UTC, the same slot Dependabot uses for this repository.
    - cron: "0 6 * * 1"
  # So a maintainer can confirm a fix without waiting a week.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strands-sdk-canary
  cancel-in-progress: false

jobs:
  latest-sdk:
    name: Latest SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install hatch

      - name: Update to the latest SDK and xa11y
        working-directory: strands-xa11y
        run: |
          hatch run pip install --upgrade strands-agents xa11y
          hatch run pip show strands-agents xa11y

      - name: Typecheck
        working-directory: strands-xa11y
        run: hatch run typecheck

      - name: Test
        working-directory: strands-xa11y
        run: hatch run test

      # The suite above fakes xa11y, so it says nothing about the real one.
      # `pip install --upgrade xa11y` may have pulled a release outside the
      # declared bound, which is precisely the case worth knowing about.
      - name: Check the real xa11y surface
        run: |
          python -m pip install --upgrade xa11y
          python strands-xa11y/tests/check_real_surface.py
