name: Update release notes

# Re-run the release-note generator against an existing tag and overwrite that
# release's notes. Useful when the notes that shipped with a release turned out
# to be wrong or thin, or when the generator failed during the publish workflow
# and the release got created with the plain git-log fallback.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to update (e.g. v0.12.0)"
        required: true
        type: string
      since:
        description: "Override the previous tag for the diff range (optional)"
        required: false
        type: string
      dry_run:
        description: "Render notes only, do not edit the release"
        required: false
        type: boolean
        default: false

jobs:
  update:
    name: Regenerate notes for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # Required by claude-code-action for OIDC token exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history + tags so the script can resolve the previous
          # tag and walk the commit range.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.tag }} not found in this repo." >&2
            exit 1
          fi

      # Deterministic half: walk the commit range and enrich each commit with
      # its PR description. No model involved, so a bad range or a missing PR
      # fails here rather than silently thinning the notes.
      - name: Collect commit and PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(context "${{ inputs.tag }}")
          if [ -n "${{ inputs.since }}" ]; then
            ARGS+=(--since "${{ inputs.since }}")
          fi
          node .github/scripts/release-notes.mjs "${ARGS[@]}" \
            > release-notes-context.txt
          echo "----- context document -----"
          cat release-notes-context.txt
          echo "----------------------------"

      # Classification half. Claude reads the context document and decides
      # which changes are user-visible. It only needs to read two files and
      # write one, so the tool grant is Read + Write — no bash, no network.
      - name: Classify changes with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Write" --model claude-opus-5'
          prompt: |
            Read `.github/release-notes-prompt.md` and follow it exactly.

            The release being documented is `${{ inputs.tag }}`.
            The commit and PR context is in `release-notes-context.txt`.

            Write the resulting JSON to `release-notes-entries.json` in the
            repository root. Write nothing else.

      # Rendering is back in code: fixed section order, PR-reference
      # deduplication, changelog link. The model's output is validated here,
      # so a bad category or an empty description fails the run instead of
      # vanishing from the release.
      - name: Render release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s release-notes-entries.json ]; then
            echo "::error::No release-notes-entries.json was produced, so there is nothing to render." >&2
            echo "The 'Classify changes with Claude' step exits 0 without doing any work in two cases:" >&2
            echo "  1. This workflow file differs from the copy on the default branch." >&2
            echo "     claude-code-action refuses to run then — otherwise a branch could rewrite a" >&2
            echo "     workflow that has access to secrets — logs 'Workflow validation failed', and" >&2
            echo "     skips itself. Grep the previous step for that line. A branch run can never" >&2
            echo "     get past this point: the workflow has to be on the default branch first." >&2
            echo "  2. CLAUDE_CODE_OAUTH_TOKEN is missing or expired. Regenerate it with" >&2
            echo "     'claude setup-token' and update the repository secret." >&2
            exit 1
          fi
          echo "----- entries -----"
          cat release-notes-entries.json
          echo "-------------------"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          ARGS=(render "${{ inputs.tag }}" --entries release-notes-entries.json)
          if [ -n "${{ inputs.since }}" ]; then
            ARGS+=(--since "${{ inputs.since }}")
          fi
          node .github/scripts/release-notes.mjs "${ARGS[@]}" > "$NOTES_FILE"
          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat "$NOTES_FILE"
          echo "-------------------------"

      - name: Update GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.notes-file }}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run — release ${{ inputs.tag }} not modified." >&2
